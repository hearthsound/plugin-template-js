name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, check, test and pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the plugin
        run: npm run build
      - name: Install hsplugin
        run: cargo install --locked --git https://github.com/hearthsound/plugin-sdk --tag v0.3.0 hearthsound-plugin-cli
      - name: Check the plugin
        run: hsplugin check
      - name: Test the catalog conformance suite
        run: hsplugin test catalog
      - name: Pack the plugin
        run: hsplugin pack --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: hello-catalog-js.hsplugin
          path: dist/*.hsplugin
